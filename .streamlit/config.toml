[theme]
base = "light"
primaryColor = "#0f766e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"

[server]
headless = false
runOnSave = false
# sirve src/ui/static/ (mapa base del Perú en TopoJSON) para que el mapa funcione sin internet
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
